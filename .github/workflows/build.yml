name: Build

on:
  push:
    branches: [master]
    # A version tag (v0.1.0) builds as usual and then makes a draft release
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # windows-2025 carries the current Visual Studio (2026 when this was written).
    # The projects use the default toolset, so they build with whatever it ships.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        # Release: the normal build. DebugLog and DebugLogMini: optimised builds
        # that write a log (Mini logs less), for bug reports. Debug: unoptimised.
        configuration: [Release, DebugLog, DebugLogMini, Debug]

    steps:
      - uses: actions/checkout@v7
        with:
          # The history and the tags, for the DLL's version (tools/git-version.ps1)
          fetch-depth: 0

      - name: Find MSBuild
        shell: bash
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          msbuild="$("$vswhere" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild/**/Bin/MSBuild.exe')"
          echo "Visual Studio $("$vswhere" -latest -property catalog_productDisplayVersion) ($("$vswhere" -latest -property displayName))"
          echo "MSBUILD=$msbuild" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          "$MSBUILD" DirectCRT.sln -m -nologo -v:minimal \
            -p:Configuration=${{ matrix.configuration }} -p:Platform=x86

      - name: Unit tests
        if: matrix.configuration == 'Release'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          tests\run_tests.cmd

      - name: Check that ddraw.dll loads
        shell: bash
        run: rundll32.exe "bin/${{ matrix.configuration }}/ddraw.dll", DDIsWindowed

      - name: Check that ddraw.dll has the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          DLL: bin/${{ matrix.configuration }}/ddraw.dll
        run: |
          $version = (Get-Item $env:DLL).VersionInfo.ProductVersion
          if ($version -ne $env:GITHUB_REF_NAME.Substring(1)) { throw "ddraw.dll is $version, the tag is $env:GITHUB_REF_NAME" }
          "ddraw.dll is $version"

      # The DLL and the licences; ddtest is a developer's tool and stays out.
      # The debug configurations keep their .pdb; Release's goes in a zip of
      # its own, for reading crash dumps, so the one most people get is small
      - name: Collect files
        shell: bash
        run: |
          bin="bin/${{ matrix.configuration }}"
          out="DirectCRT-${{ matrix.configuration }}"
          mkdir "$out"
          cp "$bin/ddraw.dll" LICENSE LICENSE-cnc-ddraw.txt "$out"
          if [[ "${{ matrix.configuration }}" == Release ]]; then
            mkdir DirectCRT-Release-symbols
            cp "$bin/ddraw.pdb" DirectCRT-Release-symbols
          else
            cp "$bin/ddraw.pdb" "$out"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: DirectCRT-${{ matrix.configuration }}
          path: DirectCRT-${{ matrix.configuration }}

      - uses: actions/upload-artifact@v7
        if: matrix.configuration == 'Release'
        with:
          name: DirectCRT-Release-symbols
          path: DirectCRT-Release-symbols

  shaders:
    # The Direct3D 11 shaders in src/d3d11_shaders are committed, so a normal
    # build needs no shader tools. This checks that they still match a fresh
    # translation of DOSBox's GLSL with the pinned glslang, SPIRV-Cross and
    # Windows SDK fxc (tools/shaders/gen_d3d11_shaders.py).
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Get the shader tools
        shell: bash
        run: python tools/shaders/gen_d3d11_shaders.py fetch

      - name: Compare with a fresh translation
        shell: bash
        run: python tools/shaders/gen_d3d11_shaders.py check

  release:
    # A draft release from a version tag, with a zip of each configuration.
    # It only runs when every build and the shader check pass; publish the
    # draft on GitHub after a look.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, shaders]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8

      - name: Zip each configuration
        run: for d in DirectCRT-*/; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" DirectCRT-*.zip
          --repo "$GITHUB_REPOSITORY" --title "DirectCRT $GITHUB_REF_NAME"
          --generate-notes --draft
